<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PipeOS Model Lab</title>

<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0b;
    --panel: #101010;
    --line: #242424;
    --ink: #e9e9e9;
    --dim: #777;
    --ok: #3ddc84;
    --bad: #f04438;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--ink);
    font: 12.5px/1.5 ui-sans-serif, system-ui, "Helvetica Neue", sans-serif;
  }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 15px; margin: 0; margin-right: auto; }
  label { color: var(--dim); display: inline-flex; align-items: center; gap: 6px; }
  input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink);
    padding: 4px 7px;
    font: inherit;
    width: 220px;
  }
  input[type="range"] { width: 130px; }
  button {
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink);
    padding: 5px 12px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,0.16); }
  #status { color: var(--dim); margin: 6px 0 16px; }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--bad); }

  #drop {
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 34px;
    text-align: center;
    color: var(--dim);
    cursor: pointer;
  }
  #drop.over { border-color: var(--ink); color: var(--ink); }

  .card {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    margin-top: 16px;
    overflow: hidden;
  }
  .card header {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    margin: 0;
  }
  .card h2 { font-size: 12.5px; font-weight: 600; margin: 0; margin-right: auto; }
  .card .meta { color: var(--dim); font-variant-numeric: tabular-nums; }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) 260px; }
  .stage { position: relative; background: #000; display: grid; place-items: center; }
  .stage img { max-width: 100%; display: block; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  ul { list-style: none; margin: 0; padding: 10px; border-left: 1px solid var(--line); }
  li { display: flex; align-items: center; gap: 8px; padding: 3px 2px; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .pct { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
  .none { color: var(--dim); padding: 10px; }
</style>

<header>
  <h1>PipeOS Model Lab</h1>
  <label>server <input id="server" type="text" /></label>
  <label>min confidence
    <input id="min" type="range" min="0" max="50" step="1" value="0" />
    <span id="minOut">0%</span>
  </label>
  <label>border
    <input id="stroke" type="range" min="0.5" max="10" step="0.5" value="3" />
    <span id="strokeOut">3.0</span>
  </label>
  <label>text
    <input id="text" type="range" min="8" max="48" step="1" value="16" />
    <span id="textOut">16</span>
  </label>
  <label>model <select id="model"></select></label>
  <button id="rerun">Re-run all</button>
</header>

<p id="status">checking…</p>

<div id="drop">Drop pipe images here, or click to choose. They go straight to the model.</div>
<input id="file" type="file" accept="image/*" multiple hidden />
<div id="results"></div>

<script type="module">
  const CLASSES = {
    'crack': ['Crack', '#f04438'],
    'deposition': ['Deposition', '#f5a524'],
    'incrustation': ['Incrustation', '#a855f7'],
    'joint offset': ['Joint offset', '#4da3ff'],
    'obstruction': ['Obstruction', '#ff6fb5'],
    'root intrusion': ['Root intrusion', '#3ddc84'],
    'utility intrusion': ['Utility intrusion', '#22d3ee'],
  }
  const UNKNOWN = '#b0b0b0'

  const classOf = (label) =>
    CLASSES[String(label).trim().toLowerCase().replace(/[_-]+/g, ' ')] ?? [label, UNKNOWN]

  const $ = (id) => document.getElementById(id)

  // Same origin by default: the Vite dev server proxies /api to the local
  // pipepatrol server, so there is one address to think about.
  const SAVED = 'pipeos.modellab.server'
  $('server').value = localStorage.getItem(SAVED) ?? location.origin
  $('server').onchange = () => {
    localStorage.setItem(SAVED, $('server').value.trim())
    checkHealth()
  }

  const base = () => $('server').value.trim().replace(/\/+$/, '') || location.origin
  const minConfidence = () => Number($('min').value) / 100

  $('min').oninput = () => {
    $('minOut').textContent = $('min').value + '%'
  }

  $('stroke').oninput = () => {
    $('strokeOut').textContent = Number($('stroke').value).toFixed(1)
    redrawAll()
  }

  $('text').oninput = () => {
    $('textOut').textContent = $('text').value
    redrawAll()
  }

  // Two things can answer here, and the lab is useful against both.
  //
  //   pipepatrol         the robot, or a full server on a laptop. It holds no
  //                      model itself and forwards frames to a detection host.
  //   pipepatrol-detect  detect-host.py, the machine actually running the
  //                      model. Pointing straight at it takes the robot out of
  //                      the loop, which is what you want when the question is
  //                      "is the model any good" rather than "is the link up".
  //
  // Both serve POST /api/detect identically, so everything below this is the
  // same either way.
  const SERVICES = ['pipepatrol', 'pipepatrol-detect']

  async function checkHealth() {
    const status = $('status')
    status.className = ''
    status.textContent = 'checking…'
    try {
      const health = await (await fetch(base() + '/api/health')).json()
      if (!SERVICES.includes(health.service)) throw new Error('not a PipeOS server')
      // The robot reports the detector through capabilities; the detection host
      // is the detector and reports it directly.
      const ready = health.service === 'pipepatrol' ? health.capabilities?.detector : health.ok
      const where = health.hostname ?? base()
      status.className = ready ? 'ok' : 'bad'
      status.textContent = ready
        ? `model loaded on ${where}`
        : `${where} is up, but no model is loaded — ${health.error ?? 'none installed'}`
      await loadModels(health.service)
    } catch (error) {
      status.className = 'bad'
      status.textContent = `cannot reach ${base()} — ${error.message}`
      $('model').innerHTML = ''
    }
  }

  // The same catalogue the console's settings screen draws its buttons from.
  // A dropdown rather than buttons here because the lab is a workbench: the
  // question it exists to answer is "which of these is better on this frame",
  // and switching wants to be one click next to the re-run button.
  async function loadModels(service) {
    const select = $('model')
    const path = service === 'pipepatrol' ? '/api/detector-model' : '/api/models'
    try {
      const body = await (await fetch(base() + path)).json()
      const models = body.models ?? []
      if (models.length === 0) throw new Error('no catalogue')
      select.innerHTML = ''
      for (const model of models) {
        const option = document.createElement('option')
        option.value = model.id
        option.textContent = model.available ? model.label : `${model.label} (not installed)`
        option.disabled = !model.available
        option.selected = model.selected
        option.title = model.error ?? model.note ?? ''
        select.append(option)
      }
      select.dataset.path = path
      select.disabled = false
    } catch {
      // An older server has no catalogue. One model, no picker, still usable.
      select.innerHTML = ''
      select.disabled = true
    }
  }

  $('model').onchange = async () => {
    const select = $('model')
    const status = $('status')
    select.disabled = true
    try {
      const response = await fetch(base() + select.dataset.path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: select.value }),
      })
      const body = await response.json()
      if (!response.ok) throw new Error(body.error ?? response.statusText)
      await checkHealth()
      // The boxes on screen came from the model that just went away, so every
      // loaded frame goes back through the new one. That is the comparison the
      // lab exists for.
      loaded.forEach(detect)
    } catch (error) {
      status.className = 'bad'
      status.textContent = `could not switch model — ${error.message}`
      select.disabled = false
    }
  }

  const loaded = []

  function add(files) {
    for (const file of files) {
      if (!file.type.startsWith('image')) continue
      const entry = { name: file.name, blob: file, url: URL.createObjectURL(file) }
      loaded.push(entry)
      render(entry)
    }
  }

  function render(entry) {
    const card = document.createElement('div')
    card.className = 'card'
    card.innerHTML = `
      <header><h2></h2><span class="meta">running…</span></header>
      <div class="body">
        <div class="stage"><img /><canvas></canvas></div>
        <ul></ul>
      </div>`
    card.querySelector('h2').textContent = entry.name
    const image = card.querySelector('img')
    image.src = entry.url
    $('results').prepend(card)
    entry.card = card
    image.onload = () => detect(entry)
  }

  async function detect(entry) {
    const card = entry.card
    const meta = card.querySelector('.meta')
    const list = card.querySelector('ul')
    meta.textContent = 'running…'

    const started = performance.now()
    let body
    try {
      const response = await fetch(
        `${base()}/api/detect?min=${minConfidence()}`,
        { method: 'POST', body: entry.blob, headers: { 'Content-Type': 'image/jpeg' } },
      )
      body = await response.json()
      if (!response.ok) throw new Error(body.error ?? response.statusText)
    } catch (error) {
      meta.textContent = error.message
      list.innerHTML = '<li class="none"></li>'
      list.querySelector('.none').textContent = String(error.message)
      return
    }

    const took = Math.round(performance.now() - started)
    const found = body.detections ?? []
    meta.textContent = `${found.length} found · ${took} ms`

    draw(card, found)

    list.textContent = ''
    if (!found.length) {
      const li = document.createElement('li')
      li.className = 'none'
      li.textContent = 'Nothing above the floor. Lower min confidence to see the best guess.'
      list.append(li)
      return
    }
    for (const detection of found) {
      const [label, colour] = classOf(detection.label)
      const li = document.createElement('li')
      const swatch = document.createElement('span')
      swatch.className = 'swatch'
      swatch.style.background = colour
      const name = document.createElement('span')
      name.textContent = label
      const pct = document.createElement('span')
      pct.className = 'pct'
      pct.textContent = (detection.confidence * 100).toFixed(1) + '%'
      li.append(swatch, name, pct)
      list.append(li)
    }
  }

  // Sizes are given at 640px wide and scaled with the image, so a slider set
  // once looks the same on every frame whatever its resolution.
  const REFERENCE_WIDTH = 640
  const strokeWidth = () => Number($('stroke').value)
  const textSize = () => Number($('text').value)

  function draw(card, detections) {
    card._detections = detections
    const image = card.querySelector('img')
    const canvas = card.querySelector('canvas')
    canvas.width = image.naturalWidth
    canvas.height = image.naturalHeight
    const context = canvas.getContext('2d')
    context.clearRect(0, 0, canvas.width, canvas.height)

    const scale = canvas.width / REFERENCE_WIDTH
    const stroke = strokeWidth() * scale
    const font = textSize() * scale
    const pad = font * 0.3
    const band = font + pad * 2

    context.lineWidth = stroke
    context.font = `${font}px ui-sans-serif, system-ui`
    context.textBaseline = 'alphabetic'

    for (const detection of detections) {
      const [label, colour] = classOf(detection.label)
      const [x0, y0, x1, y1] = detection.box
      const x = x0 * canvas.width
      const y = y0 * canvas.height
      const width = (x1 - x0) * canvas.width
      const height = (y1 - y0) * canvas.height

      context.strokeStyle = colour
      context.strokeRect(x, y, width, height)

      const text = `${label} ${(detection.confidence * 100).toFixed(1)}%`
      const measured = context.measureText(text)
      // Below the top edge when there is no room above it.
      const top = y - band >= 0 ? y - band : y
      context.fillStyle = colour
      context.fillRect(x - stroke / 2, top, measured.width + pad * 2, band)
      context.fillStyle = '#000'
      context.fillText(text, x - stroke / 2 + pad, top + band - pad)
    }
  }

  function redrawAll() {
    for (const card of document.querySelectorAll('.card')) {
      if (card._detections) draw(card, card._detections)
    }
  }

  $('drop').onclick = () => $('file').click()
  $('file').onchange = (event) => {
    add(event.target.files)
    event.target.value = ''
  }
  $('drop').ondragover = (event) => {
    event.preventDefault()
    $('drop').classList.add('over')
  }
  $('drop').ondragleave = () => $('drop').classList.remove('over')
  $('drop').ondrop = (event) => {
    event.preventDefault()
    $('drop').classList.remove('over')
    add(event.dataTransfer.files)
  }

  $('rerun').onclick = () => loaded.forEach(detect)

  checkHealth()
</script>
