<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo Day Operator Console · PipeOS</title>

<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d0e;
    --panel: #141719;
    --line: #23282b;
    --ink: #e7ebed;
    --dim: #9aa4a9;
    --faint: #5f696e;
    --live: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    max-width: 340px;
    height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: grid;
    grid-template-rows: auto auto auto auto 1fr auto auto;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  #bar {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    font-size: 11px; color: var(--dim);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--live); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  #found { margin-left: auto; font-variant-numeric: tabular-nums; }

  h1 {
    font-size: 13px; font-weight: 600; margin: 0;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }

  #warning {
    margin: 0;
    padding: 7px 12px;
    background: rgba(251, 191, 36, 0.12);
    border-bottom: 1px solid var(--line);
    color: var(--warn);
    font-size: 11px;
  }

  #footage {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    max-height: 34vh; overflow-y: auto;
  }
  ul { list-style: none; margin: 0 0 6px; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  li button {
    width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent; border-radius: 5px;
    color: var(--dim); padding: 5px 7px; font: inherit; cursor: pointer;
    display: flex; gap: 7px; align-items: center;
  }
  li button:hover { background: rgba(255,255,255,0.05); }
  li button[aria-pressed="true"] { background: rgba(255,255,255,0.1); color: var(--ink); border-color: var(--line); }
  li .n { font-variant-numeric: tabular-nums; color: var(--faint); font-size: 10px; width: 11px; flex: none; }
  li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .air { margin-left: auto; font-size: 9px; color: var(--live); flex: none; letter-spacing: 0.06em; }
  li .drop { margin-left: auto; font-size: 11px; color: var(--faint); flex: none; }

  #add {
    width: 100%;
    background: transparent; border: 1px dashed var(--line); border-radius: 6px;
    color: var(--dim); padding: 7px; font: inherit; cursor: pointer;
  }
  #add:hover { border-color: var(--faint); color: var(--ink); }
  #add.over { border-color: var(--ink); color: var(--ink); }

  #preview { position: relative; background: #000; display: grid; place-items: center; overflow: hidden; min-height: 0; }
  #preview video, #preview img { max-width: 100%; max-height: 100%; display: block; }
  #preview .empty { color: var(--faint); font-size: 11px; padding: 20px; text-align: center; }
  #tag {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,0.65); border: 1px solid var(--line); border-radius: 4px;
    padding: 2px 6px; font-size: 10px; color: var(--dim);
    letter-spacing: 0.06em;
  }

  #send {
    margin: 8px 10px;
    background: rgba(255,255,255,0.1); border: 1px solid var(--line); border-radius: 6px;
    color: var(--ink); padding: 9px; font: inherit; font-weight: 600; cursor: pointer;
  }
  #send:hover:not(:disabled) { background: rgba(255,255,255,0.17); }
  #send:disabled { opacity: 0.4; cursor: default; }

  footer { padding: 8px 12px; border-top: 1px solid var(--line); }
  #pump { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); }
  #keys { margin: 5px 0 0; color: var(--faint); font-size: 11px; }
  kbd { background: rgba(255,255,255,0.08); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font: inherit; font-size: 10px; }

  #air { position: absolute; left: -10000px; width: 320px; }
</style>

<div id="bar">
  <span class="dot" id="linkDot"></span>
  <span id="linkText">connecting</span>
  <span id="found">— found</span>
</div>

<h1>Demo Day Operator Console</h1>

<p id="warning">Simulated results.</p>

<div id="footage">
  <ul id="list"></ul>
  <button id="add">Add videos or images</button>
  <input id="file" type="file" accept="video/*,image/*" multiple hidden />
</div>

<div id="preview">
  <p class="empty" id="empty">No footage loaded.</p>
  <div id="tag" hidden>PREVIEW</div>
</div>

<button id="send" disabled>Send to console</button>

<footer>
  <div id="pump"><span class="dot" id="pumpDot"></span><span id="pumpText">nothing to send</span></div>
  <p id="keys"><kbd>←</kbd> <kbd>→</kbd> to switch footage, <kbd>enter</kbd> to send</p>
</footer>

<div id="air"></div>

<script type="module">
  const PUMP_HZ = 15
  const SEND_WIDTH = 640

  const $ = (id) => document.getElementById(id)
  const sources = []
  let activeId = null
  let sentId = null
  let sent = 0

  const httpBase = location.origin
  const active = () => sources.find((s) => s.id === activeId) ?? null

  // --- telemetry, read only ---

  let socket = null
  function connect() {
    socket = new WebSocket(httpBase.replace(/^http/i, 'ws') + '/ws')
    socket.onopen = () => setLink('on', 'connected')
    socket.onmessage = (event) => {
      let payload
      try { payload = JSON.parse(event.data) } catch { return }
      if (payload?.type !== 'telemetry') return
      $('found').textContent = `${payload.detections?.length ?? 0} found`
    }
    socket.onclose = () => {
      setLink('bad', 'reconnecting')
      setTimeout(connect, 1000)
    }
    socket.onerror = () => socket.close()
  }
  function setLink(cls, text) {
    $('linkDot').className = 'dot ' + cls
    $('linkText').textContent = text
  }

  // --- footage ---

  function add(files) {
    for (const file of files) {
      sources.push({
        id: `${Date.now().toString(36)}-${sources.length}`,
        name: file.name,
        kind: file.type.startsWith('video') ? 'video' : 'image',
        url: URL.createObjectURL(file),
      })
    }
    if (!activeId && sources.length) select(sources[0].id)
    else render()
  }

  function select(id) {
    activeId = id
    mount($('preview'), active(), 'preview')
    render()
  }

  function step(delta) {
    if (!sources.length) return
    const index = sources.findIndex((s) => s.id === activeId)
    select(sources[(index + delta + sources.length) % sources.length].id)
  }

  function remove(id) {
    const source = sources.find((s) => s.id === id)
    if (source) URL.revokeObjectURL(source.url)
    sources.splice(sources.findIndex((s) => s.id === id), 1)
    if (sentId === id) { sentId = null; airMedia = null; $('air').textContent = '' }
    if (activeId === id) select(sources[0]?.id ?? null)
    else render()
  }

  let previewMedia = null
  let airMedia = null

  function mount(host, source, role) {
    const existing = role === 'preview' ? previewMedia : airMedia
    if (existing) existing.remove()

    if (!source) {
      if (role === 'preview') { previewMedia = null; $('empty').hidden = false; $('tag').hidden = true }
      return null
    }

    const element = document.createElement(source.kind === 'video' ? 'video' : 'img')
    element.src = source.url
    if (source.kind === 'video') {
      element.muted = true
      element.loop = true
      element.playsInline = true
      element.play().catch(() => {})
    }
    host.append(element)

    if (role === 'preview') {
      previewMedia = element
      $('empty').hidden = true
      $('tag').hidden = false
      $('tag').textContent = source.id === sentId ? 'ON AIR' : 'PREVIEW'
    } else {
      airMedia = element
    }
    return element
  }

  function render() {
    const list = $('list')
    list.textContent = ''
    sources.forEach((source, index) => {
      const li = document.createElement('li')
      const button = document.createElement('button')
      button.type = 'button'
      button.setAttribute('aria-pressed', String(source.id === activeId))
      button.onclick = () => select(source.id)

      const n = document.createElement('span')
      n.className = 'n'
      n.textContent = String(index + 1)
      const name = document.createElement('span')
      name.className = 'name'
      name.textContent = source.name
      button.append(n, name)

      if (source.id === sentId) {
        const air = document.createElement('span')
        air.className = 'air'
        air.textContent = 'ON AIR'
        button.append(air)
      } else {
        const drop = document.createElement('span')
        drop.className = 'drop'
        drop.textContent = '×'
        drop.onclick = (event) => { event.stopPropagation(); remove(source.id) }
        button.append(drop)
      }

      li.append(button)
      list.append(li)
    })

    const source = active()
    $('send').disabled = !source || source.id === sentId
    $('send').textContent = !source
      ? 'Send to console'
      : source.id === sentId ? 'On air' : 'Send to console'
    if (source) $('tag').textContent = source.id === sentId ? 'ON AIR' : 'PREVIEW'
  }

  function sendToConsole() {
    const source = active()
    if (!source || source.id === sentId) return
    sentId = source.id
    mount($('air'), source, 'air')
    render()
  }

  // --- transports ---

  const channel = new BroadcastChannel('pipeos-demoday')
  let simulated = false
  channel.onmessage = (event) => {
    if (event.data?.type === 'sim-here') simulated = true
  }
  channel.postMessage({ type: 'panel-here' })

  const canvas = document.createElement('canvas')

  async function grab() {
    const media = airMedia
    if (!media) return null
    const width = media.tagName === 'VIDEO' ? media.videoWidth : media.naturalWidth
    const height = media.tagName === 'VIDEO' ? media.videoHeight : media.naturalHeight
    if (!width || !height) return null
    canvas.width = SEND_WIDTH
    canvas.height = Math.round(height * (SEND_WIDTH / width))
    canvas.getContext('2d').drawImage(media, 0, 0, canvas.width, canvas.height)
    return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.82))
  }

  let inFlight = false

  async function pump() {
    if (!sentId) return setPump(false, 'nothing to send')
    const jpeg = await grab()
    if (!jpeg) return

    if (simulated) {
      channel.postMessage({ type: 'frame', blob: jpeg })
      sent += 1
      setPump(true, 'on air — model running on this Mac')
      return
    }

    if (inFlight) return
    inFlight = true
    try {
      const response = await fetch(httpBase + '/api/demoday/frame', {
        method: 'POST', body: jpeg, headers: { 'Content-Type': 'image/jpeg' },
      })
      if (response.ok) { sent += 1; setPump(true, 'on air — model running on the robot') }
      else {
        const body = await response.json().catch(() => ({}))
        setPump(false, body.error ?? `robot refused the frame (${response.status})`)
      }
    } catch {
      setPump(false, 'cannot reach the robot')
    } finally {
      inFlight = false
    }
  }

  setInterval(pump, 1000 / PUMP_HZ)

  function setPump(on, text) {
    $('pumpDot').className = 'dot ' + (on ? 'on' : sentId ? 'bad' : '')
    $('pumpText').textContent = text
  }

  // --- controls ---

  $('add').onclick = () => $('file').click()
  $('file').onchange = (event) => { add(event.target.files); event.target.value = '' }
  $('send').onclick = sendToConsole

  for (const [event, handler] of [
    ['dragover', (e) => { e.preventDefault(); $('add').classList.add('over') }],
    ['dragleave', () => $('add').classList.remove('over')],
    ['drop', (e) => { e.preventDefault(); $('add').classList.remove('over'); add(e.dataTransfer.files) }],
  ]) {
    $('footage').addEventListener(event, handler)
  }

  window.addEventListener('keydown', (event) => {
    if (event.target.tagName === 'INPUT') return
    if (event.code === 'ArrowRight') { event.preventDefault(); step(1) }
    else if (event.code === 'ArrowLeft') { event.preventDefault(); step(-1) }
    else if (event.code === 'Enter') { event.preventDefault(); sendToConsole() }
  })

  connect()
  render()
</script>
